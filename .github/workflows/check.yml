name: Check

on:
  pull_request:
  push:
    branches:
      - main
  # Both SDKs ship majors far faster than this repo takes commits, and CI only
  # fires on push. Wake it up daily so drift has a bounded blast radius.
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
        working-directory: demo
      - run: npm run build
        working-directory: demo

  # check and demo above install from committed lockfiles, so they keep passing
  # against whatever version was pinned the last time someone pushed -- not the
  # version a reader resolves from the caret ranges in the README and the
  # templates. Between 2026-08-13 and 2026-08-24 npm shipped @usdctofiat/offramp
  # v6, v7 and v8 while these starters pinned ^5, and CI stayed green the whole
  # time because nothing re-resolved. Install without a lockfile so the next
  # major fails here instead of in someone's new app.
  published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run check
      # Typecheck stays green when a documented URL 404s — that is how #15
      # shipped past CI. Fetch the live set on the same schedule as the
      # published-SDK install so the next disappearance fails here.
      - run: npm run probe
      - run: npm install --no-package-lock
        working-directory: demo
      - run: npm run build
        working-directory: demo

  # The templates are what create-offramp-app hands to users, and the root check
  # only greps them as text. Build each one so an SDK bump or upstream release
  # that breaks a scaffold fails here instead of in someone's new app. They ship
  # without lockfiles on purpose, so this resolves the same ranges a user gets.
  templates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - next
          - base-mini-app
          - vite
          - telegram-bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: templates/${{ matrix.template }}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: templates/${{ matrix.template }}
      - run: npm run build
        working-directory: templates/${{ matrix.template }}
